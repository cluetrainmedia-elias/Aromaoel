name: Build Aroma Bachblueten APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack Android project
        run: |
          test -f Aroma_Bachblueten_Android_v1_12_1_Projekt.zip
          unzip -q Aroma_Bachblueten_Android_v1_12_1_Projekt.zip
      - name: Build installable debug APK
        working-directory: Aroma_Bachblueten_Android_v1_12_1
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aroma-Bachblueten-v1.12.1-APK
          path: Aroma_Bachblueten_Android_v1_12_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
